<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionStyle - Login</title>
    <link rel="stylesheet" href="./CSS/Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="fashion-header">
            <div class="logo">🛍️ FashionStyle</div>
            <h2>Bienvenido a nuestra tienda</h2>
            <p>Ingresa a tu cuenta para continuar</p>
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>

            <div class="remember-forgot">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-btn">Iniciar Sesión</button>
        </form>

        <div class="social-login">
            <p>O ingresa con</p>
            <div class="social-buttons">
                <button class="social-btn google">Google</button>
                <button class="social-btn facebook">Facebook</button>
            </div>
        </div>

        <div class="register-link">
            ¿No tienes cuenta? <a href="#" onclick="showRegister()">Regístrate aquí</a>
        </div>
    </div>

    <div class="notification" id="notification"></div>
    <script src="./JavaScript/Login.js"></script>
</body>
</html>
